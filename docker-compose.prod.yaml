services:
  app:
    # The image CI publishes. Named outright rather than through .env, so a
    # manual `docker compose` on the host runs the same image a deploy does.
    image: ghcr.io/fedbxy/grader:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grader-app
    ports:
      - ${NEXT_PRIVATE_PORT}:3000
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - S3_ENDPOINT=minio-storage
      - S3_PORT=9001
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - NEXT_PRIVATE_TURNSTILE_SECRET_KEY=${NEXT_PRIVATE_TURNSTILE_SECRET_KEY}
    networks:
      - grader-network
    restart: unless-stopped
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - grader-network
    restart: unless-stopped

  minio:
    # Silo: the maintained MinIO fork (github.com/pgsty/silo). MinIO stopped
    # publishing images and archived its repo; Silo reads the same on-disk
    # format, so it runs on the existing minio-data volume with the same
    # MINIO_* env, root credentials and service accounts. The service and
    # container keep their names so S3_ENDPOINT=minio-storage still resolves.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio-storage
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    # Only the console is published. It listens on every interface so it is
    # reachable over Tailscale (http://<tailscale-ip>:9000); the host sits
    # behind NAT and is served publicly only through the Cloudflare Tunnel,
    # which does not forward this port. If the host ever gets a public IP,
    # bind this to the Tailscale address instead: Docker's iptables rules
    # bypass ufw. The app and the judge use the S3 API on 9001 over the Docker
    # network, so 9001 needs no published port.
    ports:
      - 9000:9000
    volumes:
      - minio-data:/data
    networks:
      - grader-network
    command: server --address ":9001" --console-address ":9000" /data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

networks:
  grader-network:
    driver: bridge