name: Build, Push, and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-to-host:
    name: Deploy to Remote Host
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Deploy to Host
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          private_key_filename: ${{ secrets.SSH_PRIVATE_KEY_FILENAME }}
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
          port: ${{ secrets.SSH_PORT }}
          service_token_id: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_ID }}
          service_token_secret: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_SECRET }}
          commands: |
            cd ~/Desktop/grader
            git fetch origin main
            git reset --hard origin/main

            # Deploy the image CI just built. The host's .env named it without
            # its owner (ghcr.io/grader), which GHCR rejects as "name invalid";
            # compose then quietly reused whatever stale image was cached here,
            # so deploys reported success without changing anything. Exported
            # variables take precedence over .env.
            export REGISTRY=ghcr.io
            export IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            # Only the app. minio/minio can no longer be pulled from Docker Hub,
            # and one service's failed pull interrupts the others; postgres and
            # minio keep running from their cached images.
            docker compose -f docker-compose.prod.yaml pull app || { echo "pull failed; not deploying"; exit 1; }
            docker compose -f docker-compose.prod.yaml up -d --force-recreate
            docker image prune -f

            # Fail the deploy unless the app comes up on the new image. The
            # container runs migrations before starting the server, so "Ready"
            # also means they applied. Only fixed status text is printed;
            # these logs are public.
            for i in $(seq 1 60); do
              docker logs grader-app 2>&1 | grep -q "Ready in" && break
              sleep 2
            done
            docker logs grader-app 2>&1 | grep -oE "Applying migration \`[0-9A-Za-z_]+\`|No pending migrations to apply|All migrations have been successfully applied|Ready in [0-9a-z.]+"
            docker logs grader-app 2>&1 | grep -q "Ready in" || { echo "app did not come up; on the host run: docker logs grader-app"; exit 1; }
