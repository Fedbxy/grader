name: Build, Push, and Deploy

on:
  push:
    branches:
      - main
  # "Run workflow" on the Actions tab. Restarting everything also pulls a fresh
  # Postgres image, e.g. to take a postgres:16 patch release; normal deploys
  # never do.
  workflow_dispatch:
    inputs:
      restart_all:
        description: Pull fresh images and restart every container, Postgres and storage included
        type: boolean
        default: false

# One build-and-deploy at a time. Without this, two merges race: two deploys
# touch the host at once, and an older build can push :main last so the newer
# deploy ships older code. Queued runs wait instead of being cancelled, since
# killing a deploy halfway can leave the host half-updated; GitHub keeps only
# the newest waiting run, and the newest main contains everything.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    # The production host is arm64, and images built on ubuntu-latest are
    # amd64-only: the host could never pull them ("no matching manifest for
    # linux/arm64/v8"), so deploys silently ran images built on the host.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-to-host:
    name: Deploy to Remote Host
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Deploy to Host
        uses: and-fm/cloudflared-ssh-action@v3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          private_key_filename: ${{ secrets.SSH_PRIVATE_KEY_FILENAME }}
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
          port: ${{ secrets.SSH_PORT }}
          service_token_id: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_ID }}
          service_token_secret: ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_SECRET }}
          commands: |
            cd ~/Desktop/grader
            git fetch origin main
            git reset --hard origin/main

            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            if [ "${{ github.event.inputs.restart_all }}" = "true" ]; then
              # Manual run: fresh images for everything, every container restarted.
              docker compose -f docker-compose.prod.yaml pull || { echo "pull failed; not deploying"; exit 1; }
              docker compose -f docker-compose.prod.yaml up -d --force-recreate
            else
              # The app and object storage (Silo, pinned by release tag). Postgres
              # is left out so a deploy never moves it to a newer postgres:16.x
              # on its own; it keeps running from its cached image.
              docker compose -f docker-compose.prod.yaml pull app minio || { echo "pull failed; not deploying"; exit 1; }
              # Postgres and storage are recreated only if their definition in
              # the compose file changed (image tag, env, ports, volumes...);
              # otherwise they keep running, so a deploy doesn't drop every
              # database connection. The app always restarts on the new image.
              docker compose -f docker-compose.prod.yaml up -d postgres minio
              docker compose -f docker-compose.prod.yaml up -d --no-deps --force-recreate app
            fi
            docker image prune -f

            # The app must be running the image just pulled: otherwise the
            # "Ready" check below could pass on the previous container's logs.
            [ "$(docker inspect -f '{{.Image}}' grader-app)" = "$(docker image inspect -f '{{.Id}}' ghcr.io/fedbxy/grader:main)" ] || { echo "app is not running the new image"; exit 1; }

            # Fail the deploy unless the app comes up on the new image. The
            # container runs migrations before starting the server, so "Ready"
            # also means they applied. Only fixed status text is printed;
            # these logs are public.
            for i in $(seq 1 60); do
              docker logs grader-app 2>&1 | grep -q "Ready in" && break
              sleep 2
            done
            docker logs grader-app 2>&1 | grep -oE "Applying migration \`[0-9A-Za-z_]+\`|No pending migrations to apply|All migrations have been successfully applied|Ready in [0-9a-z.]+"
            docker logs grader-app 2>&1 | grep -q "Ready in" || { echo "app did not come up; on the host run: docker logs grader-app"; exit 1; }

            # Object storage must pass its healthcheck too: the app starts
            # without it, but every statement, avatar and testcase needs it.
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' minio-storage)" = healthy ] && break
              sleep 2
            done
            echo "object storage: $(docker inspect -f '{{.State.Health.Status}}' minio-storage)"
            [ "$(docker inspect -f '{{.State.Health.Status}}' minio-storage)" = healthy ] || { echo "object storage is not healthy; on the host run: docker logs minio-storage"; exit 1; }
