services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - grader-network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-07-31T05-46-26Z
    container_name: minio-storage
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    command: server --address ":9001" --console-address ":9000" /data
    networks:
      - grader-network
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

# Named to match docker-compose.prod.yaml, so it resolves to
# grader_grader-network: the external network the judge attaches to. Without
# it the judge lands on its own network and cannot resolve postgres-db.
networks:
  grader-network:
    driver: bridge
