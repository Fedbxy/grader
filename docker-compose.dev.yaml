services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - grader-network
    restart: unless-stopped

  minio:
    # Silo, the maintained MinIO fork; see docker-compose.prod.yaml. 9001 stays
    # published here because `bun dev` on the host reaches S3 at localhost:9001.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio-storage
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    command: server --address ":9001" --console-address ":9000" /data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - grader-network
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

# Named to match docker-compose.prod.yaml, so it resolves to
# grader_grader-network: the external network the judge attaches to. Without
# it the judge lands on its own network and cannot resolve postgres-db.
networks:
  grader-network:
    driver: bridge
